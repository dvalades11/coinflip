<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EconPlay</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: #0b1220;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #e2e8f0;
    overscroll-behavior: none;
  }
  #app {
    max-width: 440px; margin: 0 auto; min-height: 100%;
    padding: 20px 16px 40px;
    display: flex; flex-direction: column;
  }
  .fade { animation: fade .35s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px);} to { opacity:1; transform:none;} }

  :focus-visible { outline: 2px solid #38bdf8; outline-offset: 2px; }

  /* ---------- Home ---------- */
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .brand { font-size: 22px; font-weight: 800; letter-spacing: -.5px; }
  .brand span { color: #38bdf8; }
  .streak {
    display: flex; align-items: center; gap: 6px;
    background: #1e293b; border-radius: 999px; padding: 6px 12px;
    font-size: 14px; font-weight: 700;
  }
  .streak.hot { background: linear-gradient(135deg,#f97316,#ef4444); }

  .daily {
    background: linear-gradient(135deg, #7c3aed, #2563eb);
    border-radius: 20px; padding: 18px; margin-bottom: 18px;
    position: relative; overflow: hidden; cursor: pointer;
    transition: transform .15s;
  }
  .daily:active { transform: scale(.98); }
  .daily.done { background: linear-gradient(135deg,#1e293b,#334155); }
  .daily .tag { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; opacity: .85; font-weight: 700; }
  .daily h3 { margin: 6px 0 4px; font-size: 19px; }
  .daily p { margin: 0; font-size: 13px; opacity: .85; padding-right: 36px; }
  .daily .check { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-size: 28px; }

  .section-label { font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: #64748b; font-weight: 700; margin: 0 0 10px 4px; }

  .level {
    display: flex; align-items: center; gap: 14px;
    background: #131c2e; border-radius: 18px; padding: 14px;
    margin-bottom: 10px; cursor: pointer; border: 1px solid #1e293b;
    transition: transform .15s, border-color .15s;
  }
  .level:active { transform: scale(.98); border-color: #334155; }
  .level .icon {
    width: 48px; height: 48px; border-radius: 14px;
    display: grid; place-items: center; font-size: 24px; flex-shrink: 0;
  }
  .level .meta { flex: 1; min-width: 0; }
  .level .meta h4 { margin: 0 0 3px; font-size: 16px; font-weight: 700; }
  .level .meta p { margin: 0; font-size: 12px; color: #94a3b8; }
  .level .stars { font-size: 14px; letter-spacing: 2px; color: #334155; flex-shrink: 0; }
  .level .stars .on { color: #fbbf24; }

  /* ---------- Buttons ---------- */
  .btn {
    display: block; width: 100%; border: none; border-radius: 16px;
    padding: 16px; font-size: 16px; font-weight: 700; font-family: inherit;
    background: #38bdf8; color: #06121f; cursor: pointer;
    transition: transform .12s, opacity .12s;
  }
  .btn:active { transform: scale(.97); }
  .btn.ghost { background: #1e293b; color: #cbd5e1; }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn-row { display: flex; gap: 10px; margin-top: 14px; }
  .btn-row .btn { margin: 0; }

  /* ---------- Level screens ---------- */
  .back { background: none; border: none; color: #64748b; font-size: 15px; font-family: inherit; padding: 4px 0; cursor: pointer; margin-bottom: 10px; align-self: flex-start; }
  .pill { display: inline-block; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.4px; padding: 5px 11px; border-radius: 999px; margin-bottom: 12px; }
  h1.title { font-size: 26px; margin: 0 0 8px; letter-spacing: -.6px; line-height: 1.15; text-wrap: balance; }
  .lede { font-size: 15px; line-height: 1.5; color: #94a3b8; margin: 0 0 20px; }
  .lede b { color: #e2e8f0; }

  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .card {
    background: #131c2e; border: 2px solid #1e293b; border-radius: 16px;
    padding: 16px 10px; text-align: center; cursor: pointer; color: inherit; font-family: inherit;
    transition: transform .12s, border-color .15s, background .15s;
  }
  .card:active { transform: scale(.95); }
  .card.sel { border-color: #38bdf8; background: #0e2233; }
  .card .em { font-size: 26px; display: block; margin-bottom: 6px; }
  .card .nm { font-size: 13px; font-weight: 600; }
  .card .vl { font-size: 11px; color: #64748b; margin-top: 2px; }

  .slider-wrap { background: #131c2e; border-radius: 18px; padding: 18px; margin-bottom: 16px; border: 1px solid #1e293b; }
  .slider-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .slider-head .lbl { font-size: 14px; color: #94a3b8; }
  .slider-head .val { font-size: 26px; font-weight: 800; color: #38bdf8; font-variant-numeric: tabular-nums; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 8px; border-radius: 999px;
    background: #1e293b; outline: none; margin: 0;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%;
    background: #38bdf8; cursor: pointer; border: 4px solid #0b1220;
    box-shadow: 0 0 0 1px #38bdf8;
  }
  input[type=range]::-moz-range-thumb {
    width: 20px; height: 20px; border-radius: 50%; background: #38bdf8;
    cursor: pointer; border: 4px solid #0b1220;
  }
  .scale { display: flex; justify-content: space-between; font-size: 11px; color: #475569; margin-top: 8px; }

  /* ---------- Results ---------- */
  .result-box { background: #131c2e; border-radius: 18px; padding: 18px; margin-bottom: 14px; border: 1px solid #1e293b; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; font-size: 14px; border-bottom: 1px solid #1e293b; }
  .row:last-child { border-bottom: none; }
  .row .k { color: #94a3b8; min-width: 0; }
  .row .v { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
  .good { color: #4ade80; } .bad { color: #f87171; } .warn { color: #fbbf24; }

  .verdict { border-radius: 18px; padding: 16px; margin-bottom: 14px; font-size: 15px; line-height: 1.5; }
  .verdict.win { background: #052e1c; border: 1px solid #166534; color: #bbf7d0; }
  .verdict.lose { background: #2e0d0d; border: 1px solid #7f1d1d; color: #fecaca; }
  .verdict.mid { background: #2a1f05; border: 1px solid #854d0e; color: #fde68a; }
  .verdict strong { display: block; margin-bottom: 6px; font-size: 16px; }

  .insight { background: #0e2233; border-left: 3px solid #38bdf8; border-radius: 0 12px 12px 0; padding: 14px; font-size: 14px; line-height: 1.5; color: #bae6fd; margin-bottom: 16px; }
  .insight > b:first-child { color: #38bdf8; display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 5px; }

  /* ---------- Chart ---------- */
  .chart { width: 100%; height: auto; display: block; margin: 4px 0 12px; }
  .chart .grid { stroke: #334155; stroke-width: 1; }
  .chart .line { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .chart .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.1s ease forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: #94a3b8; margin-bottom: 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: middle; }

  /* ---------- Challenge ---------- */
  .timerbar { height: 5px; background: #1e293b; border-radius: 999px; overflow: hidden; margin-bottom: 20px; }
  .timerbar i { display: block; height: 100%; background: linear-gradient(90deg,#38bdf8,#a855f7); width: 100%; }
  .timerbar.run i { animation: shrink 8s linear forwards; }
  @keyframes shrink { to { width: 0%; } }

  .option-btn {
    display: block; width: 100%; text-align: left; background: #131c2e;
    border: 2px solid #1e293b; border-radius: 14px; padding: 15px 16px;
    color: #e2e8f0; font-size: 15px; font-family: inherit; font-weight: 600;
    margin-bottom: 9px; cursor: pointer; transition: transform .12s, border-color .15s;
  }
  .option-btn:active { transform: scale(.98); }
  .option-btn.picked { border-color: #38bdf8; background: #0e2233; }
  .option-btn.correct { border-color: #4ade80; background: #052e1c; }
  .option-btn.wrong { border-color: #f87171; background: #2e0d0d; }

  .dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 18px; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: #1e293b; }
  .dots i.on { background: #38bdf8; }
  .dots i.ok { background: #4ade80; }
  .dots i.no { background: #f87171; }

  .center { text-align: center; }
  .big-star { font-size: 52px; margin: 10px 0; letter-spacing: 6px; }
  .muted { color: #64748b; font-size: 13px; line-height: 1.5; }

  @media (prefers-reduced-motion: reduce) {
    .fade, .chart .draw { animation: none; stroke-dashoffset: 0; }
    .btn, .card, .level, .option-btn, .daily { transition: none; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   STATE
   ========================================================= */
const DEFAULT = { stars: {}, streak: 0, lastDaily: null };
let S = load();
let screen = 'home';
let payload = {};

function load() {
  try {
    const raw = localStorage.getItem('econplay');
    if (raw) return Object.assign({}, DEFAULT, JSON.parse(raw));
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT));
}
function save() {
  try { localStorage.setItem('econplay', JSON.stringify(S)); } catch (e) {}
}
function dateKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function todayKey() { return dateKey(new Date()); }
// Day index in the player's local calendar, so the daily puzzle flips at local midnight.
function localDayIndex() {
  const d = new Date();
  return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
}
function setStars(id, n) {
  if ((S.stars[id] || 0) < n) S.stars[id] = n;
  save();
}
function starRow(n) {
  return [0,1,2].map(i=>`<span style="color:${i<n?'#fbbf24':'#1e293b'}">★</span>`).join('');
}

/* =========================================================
   LEVEL DEFINITIONS
   ========================================================= */
const LEVELS = [
  { id:'opp',    emoji:'🌙', title:'Friday Night',  sub:'Opportunity Cost',        color:'#f59e0b', bg:'#2a1f05' },
  { id:'marg',   emoji:'☕', title:'Coffee Stand',  sub:'Marginal Thinking',       color:'#22c55e', bg:'#052e1c' },
  { id:'fish',   emoji:'🐟', title:'Fish Pond',     sub:'Feedback Loops',          color:'#06b6d4', bg:'#062a33' },
  { id:'policy', emoji:'🏛️', title:'Policy Lab',    sub:'Unintended Consequences', color:'#ec4899', bg:'#2e0a20' }
];

/* =========================================================
   RENDER ROUTER
   ========================================================= */
const app = document.getElementById('app');
function go(s, p) {
  clearTimeout(chalTimer);
  screen = s; payload = p || {}; render(); window.scrollTo(0,0);
}
function render() {
  const map = {
    home: renderHome,
    opp: renderOpp,
    marg: renderMarg,
    fish: renderFish,
    policy: renderPolicy,
    daily: renderDaily,
    challenge: renderChallenge
  };
  const node = map[screen]();
  node.classList.add('fade');
  app.innerHTML = '';
  app.appendChild(node);
}
function h(html) {
  const d = document.createElement('div');
  d.innerHTML = html.trim();
  return d.firstElementChild;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* =========================================================
   HOME
   ========================================================= */
function renderHome() {
  const dailyDone = S.lastDaily === todayKey();
  const totalStars = Object.values(S.stars).reduce((a,b)=>a+b,0);
  const maxStars = LEVELS.length * 3 + 3;

  const levelsHTML = LEVELS.map(l => {
    const st = S.stars[l.id] || 0;
    const stars = [0,1,2].map(i => `<span class="${i<st?'on':''}">★</span>`).join('');
    return `
      <div class="level" role="button" tabindex="0" onclick="go('${l.id}')">
        <div class="icon" style="background:${l.bg}; color:${l.color}">${l.emoji}</div>
        <div class="meta">
          <h4>${l.title}</h4>
          <p>${l.sub}</p>
        </div>
        <div class="stars" aria-label="${st} of 3 stars">${stars}</div>
      </div>`;
  }).join('');

  return h(`
    <div>
      <div class="topbar">
        <div class="brand">Econ<span>Play</span></div>
        <div class="streak ${S.streak>0?'hot':''}" title="Daily streak">🔥 ${S.streak}</div>
      </div>

      <div class="daily ${dailyDone?'done':''}" role="button" tabindex="0" onclick="go('daily')">
        <div class="tag">Daily Challenge</div>
        <h3>${dailyDone ? 'Done for today' : "Today's puzzle"}</h3>
        <p>${dailyDone ? 'Come back tomorrow to keep your streak' : 'One decision. One minute. Same for everyone.'}</p>
        ${dailyDone ? '<div class="check">✅</div>' : ''}
      </div>

      <p class="section-label">Learn</p>
      ${levelsHTML}

      <p class="section-label" style="margin-top:20px">Test</p>
      <div class="level" role="button" tabindex="0" onclick="go('challenge')" style="border-color:#334155">
        <div class="icon" style="background:#2a1f05; color:#fbbf24">⚡</div>
        <div class="meta">
          <h4>Challenge Mode</h4>
          <p>${CHALLENGE_QS.length} rapid questions · no hints · 8s each</p>
        </div>
        <div class="stars">
          ${[0,1,2].map(i=>`<span class="${i<(S.stars['challenge']||0)?'on':''}">★</span>`).join('')}
        </div>
      </div>

      <p class="muted center" style="margin-top:22px">
        ${totalStars} / ${maxStars} stars collected
      </p>
    </div>
  `);
}

// Keyboard access for div "buttons"
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button]')) {
    e.preventDefault(); e.target.click();
  }
});

/* =========================================================
   LEVEL 1 — OPPORTUNITY COST
   ========================================================= */
const OPP_OPTIONS = [
  { id:'study',   label:'Study',   value:8,  emoji:'📚' },
  { id:'work',    label:'Work',    value:6,  emoji:'💼' },
  { id:'friends', label:'Friends', value:10, emoji:'🧑‍🤝‍🧑' },
  { id:'gym',     label:'Gym',     value:7,  emoji:'🏋️' },
  { id:'rest',    label:'Rest',    value:5,  emoji:'😴' },
  { id:'game',    label:'Game',    value:9,  emoji:'🎮' }
];
let oppPicked = [];

function renderOpp() {
  if (payload.stage === 'result') return renderOppResult();
  oppPicked = [];

  const cards = OPP_OPTIONS.map(o => `
    <button class="card" id="card-${o.id}" onclick="toggleOpp('${o.id}')">
      <span class="em">${o.emoji}</span>
      <div class="nm">${o.label}</div>
      <div class="vl">${o.value} pts</div>
    </button>`).join('');

  return h(`
    <div>
      <button class="back" onclick="go('home')">← Back</button>
      <span class="pill" style="background:#2a1f05; color:#f59e0b">Opportunity Cost</span>
      <h1 class="title">Friday Night Planner</h1>
      <p class="lede">You have one free night. Pick 3 activities. The best one you <b>leave behind</b> is your opportunity cost.</p>
      <div class="cards">${cards}</div>
      <button class="btn" id="oppConfirm" disabled onclick="finishOpp()">Pick 3 activities</button>
    </div>
  `);
}

function toggleOpp(id) {
  const i = oppPicked.indexOf(id);
  const el = document.getElementById('card-' + id);
  if (i > -1) { oppPicked.splice(i,1); el.classList.remove('sel'); }
  else if (oppPicked.length < 3) { oppPicked.push(id); el.classList.add('sel'); }
  else return;

  const btn = document.getElementById('oppConfirm');
  btn.disabled = oppPicked.length !== 3;
  btn.textContent = oppPicked.length === 3 ? 'Confirm choices' : `Pick ${3 - oppPicked.length} more`;
}

function finishOpp() {
  const picked = OPP_OPTIONS.filter(o => oppPicked.includes(o.id));
  const skipped = OPP_OPTIONS.filter(o => !oppPicked.includes(o.id)).sort((a,b) => b.value - a.value);
  const total = picked.reduce((a,b) => a + b.value, 0);
  const bestSkipped = skipped[0];
  const maxPossible = 10 + 9 + 8;

  let stars = 1;
  if (total >= 24) stars = 2;
  if (total >= 27) stars = 3;
  setStars('opp', stars);

  go('opp', { stage:'result', picked, skipped, total, bestSkipped, stars, maxPossible });
}

function renderOppResult() {
  const { picked, skipped, total, bestSkipped, stars, maxPossible } = payload;
  const perfect = total === maxPossible;

  const pickedRows = picked.map(p =>
    `<div class="row"><span class="k">${p.emoji} ${p.label}</span><span class="v good">+${p.value}</span></div>`
  ).join('');

  const skippedRows = skipped.map((s,i) =>
    `<div class="row"><span class="k">${s.emoji} ${s.label}${i===0?' · <b class="warn">best alternative</b>':''}</span><span class="v ${i===0?'warn':'bad'}">${s.value}</span></div>`
  ).join('');

  return h(`
    <div>
      <button class="back" onclick="go('home')">← Home</button>
      <span class="pill" style="background:#2a1f05; color:#f59e0b">Result</span>
      <h1 class="title">${total} points earned</h1>

      <div class="result-box">
        <div class="row"><span class="k">Your picks</span><span class="v">${total} / ${maxPossible} pts</span></div>
        ${pickedRows}
      </div>

      <p class="section-label">What you gave up</p>
      <div class="result-box">
        ${skippedRows}
      </div>

      <div class="verdict ${perfect?'win':'mid'}">
        <strong>Opportunity cost = ${bestSkipped.value}</strong>
        You said yes to ${picked.length} things. The real cost isn't the sum of everything you skipped. It's the <b>single best one</b>: ${bestSkipped.emoji} ${bestSkipped.label}.
        ${perfect ? '' : `<br><br>Swapping your lowest pick for ${bestSkipped.label} would have earned more.`}
      </div>

      <div class="insight">
        <b>Key idea</b>
        Every yes is a no. When you choose, you give up your best alternative, and that alternative is the true price.
      </div>

      <div class="center big-star" aria-label="${stars} of 3 stars">${starRow(stars)}</div>

      <button class="btn" onclick="go('marg')">Next: Coffee Stand →</button>
      <div class="btn-row">
        <button class="btn ghost" onclick="go('opp')">Try again</button>
        <button class="btn ghost" onclick="go('home')">Home</button>
      </div>
    </div>
  `);
}

/* =========================================================
   LEVEL 2 — MARGINAL THINKING
   ========================================================= */
let margChoice = null;

function renderMarg() {
  if (payload.stage === 'result') return renderMargResult();
  margChoice = null;

  const v = { workerCost:20, cups:15, profit:2 };

  return h(`
    <div>
      <button class="back" onclick="go('home')">← Back</button>
      <span class="pill" style="background:#052e1c; color:#22c55e">Marginal Thinking</span>
      <h1 class="title">The 4th Worker</h1>
      <p class="lede">Your coffee stand has 3 workers and demand is surging. Should you hire one more?</p>

      <div class="result-box">
        <div class="row"><span class="k">Extra cups they can make per day</span><span class="v">${v.cups}</span></div>
        <div class="row"><span class="k">Profit per cup</span><span class="v">$${v.profit}</span></div>
        <div class="row"><span class="k">Daily wage for the 4th worker</span><span class="v bad">$${v.workerCost}</span></div>
      </div>

      <p class="lede" style="margin-bottom:12px"><b>Hire the 4th worker?</b></p>

      <button class="option-btn" id="opt-hire" onclick="pickMarg('hire')">✅ Hire them</button>
      <button class="option-btn" id="opt-stop" onclick="pickMarg('stop')">⛔ Keep 3 workers</button>

      <button class="btn" id="margConfirm" style="margin-top:6px" disabled onclick="finishMarg()">Confirm</button>
    </div>
  `);
}

function pickMarg(c) {
  margChoice = c;
  document.getElementById('opt-hire').classList.toggle('picked', c === 'hire');
  document.getElementById('opt-stop').classList.toggle('picked', c === 'stop');
  document.getElementById('margConfirm').disabled = false;
}

function finishMarg() {
  const rev = 15 * 2, cost = 20, net = rev - cost;
  const correct = margChoice === 'hire';
  const stars = correct ? 3 : 1;
  setStars('marg', stars);
  go('marg', { stage:'result', rev, cost, net, correct, stars });
}

function renderMargResult() {
  const { rev, cost, net, correct, stars } = payload;

  return h(`
    <div>
      <button class="back" onclick="go('home')">← Home</button>
      <span class="pill" style="background:#052e1c; color:#22c55e">Result</span>
      <h1 class="title">${correct ? 'Correct call' : 'You left money behind'}</h1>

      <div class="result-box">
        <div class="row"><span class="k">Marginal benefit (15 × $2)</span><span class="v good">+$${rev}</span></div>
        <div class="row"><span class="k">Marginal cost (wage)</span><span class="v bad">−$${cost}</span></div>
        <div class="row"><span class="k"><b>Net gain</b></span><span class="v ${net>0?'good':'bad'}">${net>0?'+':''}$${net}</span></div>
      </div>

      <div class="verdict ${correct?'win':'mid'}">
        <strong>${correct ? 'You hired. Net +$10 per day.' : 'You should have hired. That\'s $10/day missed.'}</strong>
        Marginal benefit ($30) beat marginal cost ($20). When the next unit earns more than it costs, take it.
      </div>

      <div class="insight">
        <b>Key idea</b>
        Think in <b>extras</b>, not totals. Compare the extra revenue from one more worker against the extra cost of that worker. Sunk costs don't matter.
      </div>

/* =========================================================
   LEVEL 3 — FEEDBACK LOOPS (Fish Pond)
   ========================================================= */
const FISH_SEASONS = 10;
const FISH_COLLAPSE = 20;
let fishRate = 12;

function simulateFish(ratePct) {
  const r = ratePct / 100;
  const regen = 0.10;
  const stock = [100, 100];
  const catchArr = [];
  let collapsed = false;

  for (let t = 2; t <= FISH_SEASONS + 1; t++) {
    const births = regen * stock[t - 2];
    const harvest = r * stock[t - 1];
    const next = stock[t - 1] + births - harvest;
    catchArr.push(Math.round(harvest * 10) / 10);
    if (next < FISH_COLLAPSE) { stock.push(0); collapsed = true; break; }
    stock.push(Math.round(next * 10) / 10);
  }
  const totalCatch = catchArr.reduce((a,b) => a + b, 0);
  return { stock, totalCatch: Math.round(totalCatch), collapsed };
}

function renderFish() {
  if (payload.stage === 'result') return renderFishResult();

  return h(`
    <div>
      <button class="back" onclick="go('home')">← Back</button>
      <span class="pill" style="background:#062a33; color:#06b6d4">Feedback Loops</span>
      <h1 class="title">Fish Pond</h1>
      <p class="lede">You manage a pond with <b>100 fish</b>. Each season, births equal ~10% of the population two seasons ago. Pick a harvest rate. The goal: catch plenty <b>and</b> leave a healthy pond.</p>

      <div class="result-box" style="margin-bottom:16px">
        <div class="row"><span class="k">🐟 Fish → births → more fish</span><span class="v good">Reinforcing</span></div>
        <div class="row"><span class="k">🪝 Harvest → fewer fish → fewer births</span><span class="v bad">Balancing</span></div>
      </div>

      <div class="slider-wrap">
        <div class="slider-head">
          <label class="lbl" for="fishSlider">Harvest rate</label>
          <span class="val" id="fishVal">${fishRate}%</span>
        </div>
        <input type="range" min="0" max="40" value="${fishRate}" id="fishSlider"
          oninput="fishRate=+this.value; document.getElementById('fishVal').textContent=this.value+'%'">
        <div class="scale"><span>0%</span><span>10% = breeding rate</span><span>40%</span></div>
      </div>

      <p class="muted" style="margin:0 0 16px">⚠️ Harvest faster than they breed and the pond shrinks. Push too hard and it collapses below ${FISH_COLLAPSE} fish. Births lag, so the damage shows up later.</p>

      <button class="btn" onclick="runFish()">Run ${FISH_SEASONS} seasons</button>
    </div>
  `);
}

function runFish() {
  const sim = simulateFish(fishRate);
  const finalStock = sim.stock[sim.stock.length - 1];
  // Reward sustainable yield: a big catch that leaves a healthy pond.
  let stars = 1;
  if (!sim.collapsed && sim.totalCatch >= 50 && finalStock >= 60) stars = 2;
  if (!sim.collapsed && sim.totalCatch >= 90 && finalStock >= 90) stars = 3;
  setStars('fish', stars);
  go('fish', { stage:'result', ...sim, finalStock, rate: fishRate, stars });
}

function fishChart(stock, collapsed) {
  const W = 320, H = 150, padL = 26, padR = 10, padT = 10, padB = 20;
  const maxV = Math.max(140, Math.ceil(Math.max(...stock) / 20) * 20);
  const n = FISH_SEASONS + 2; // fixed axis: seasons 0..11, so a collapse ends early
  const x = i => padL + (i / (n - 1)) * (W - padL - padR);
  const y = v => H - padB - (v / maxV) * (H - padT - padB);
  const pts = stock.map((v,i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const col = collapsed ? '#f87171' : '#06b6d4';
  const ticks = [0, 50, 100].filter(v => v <= maxV);

  return `
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Fish stock by season">
      ${ticks.map(v => `
        <line class="grid" x1="${padL}" y1="${y(v)}" x2="${W-padR}" y2="${y(v)}" stroke-opacity=".5"/>
        <text x="${padL-5}" y="${y(v)+3}" fill="#64748b" font-size="9" text-anchor="end">${v}</text>`).join('')}
      <line class="grid" x1="${padL}" y1="${y(FISH_COLLAPSE)}" x2="${W-padR}" y2="${y(FISH_COLLAPSE)}" stroke="#f87171" stroke-opacity=".6" stroke-dasharray="4 4"/>
      <text x="${W-padR}" y="${y(FISH_COLLAPSE)-4}" fill="#f87171" font-size="9" text-anchor="end">collapse (${FISH_COLLAPSE})</text>
      <text x="${padL}" y="${H-5}" fill="#64748b" font-size="9">season 0</text>
      <text x="${W-padR}" y="${H-5}" fill="#64748b" font-size="9" text-anchor="end">season ${n-1}</text>
      <polyline class="line draw" points="${pts}" stroke="${col}"/>
      ${stock.map((v,i) => `<circle cx="${x(i)}" cy="${y(v)}" r="2.5" fill="${col}"/>`).join('')}
    </svg>`;
}

function renderFishResult() {
  const { stock, totalCatch, collapsed, rate, stars, finalStock } = payload;

  let verdictClass, verdictTitle, verdictText;
  if (collapsed) {
    verdictClass = 'lose';
    verdictTitle = '💥 The pond collapsed';
    verdictText = `You harvested at ${rate}%, far faster than the fish could breed. Because births lag behind, the damage built up quietly until the stock crashed.`;
  } else if (rate <= 10 && totalCatch < 50) {
    verdictClass = 'mid';
    verdictTitle = '🐢 Too cautious';
    verdictText = `At ${rate}% the pond grew to ${finalStock} fish, but you only caught ${totalCatch}. A rate closer to the 10% breeding rate harvests the surplus without shrinking the stock.`;
  } else if (rate <= 11) {
    verdictClass = 'win';
    verdictTitle = '✅ Sustainable harvest';
    verdictText = `At ${rate}% you harvested about what the fish replace each season. The stock held near ${finalStock} and you caught ${totalCatch} fish. The pond can keep doing this forever.`;
  } else {
    verdictClass = 'mid';
    verdictTitle = '⚠️ Slow decline';
    verdictText = `At ${rate}% you caught ${totalCatch} fish, but you out-harvested the breeding rate. The pond shrank to ${finalStock}, so every future season yields less.`;
  }

  return h(`
    <div>
      <button class="back" onclick="go('home')">← Home</button>
      <span class="pill" style="background:#062a33; color:#06b6d4">Result</span>
      <h1 class="title">${collapsed ? 'Collapse' : finalStock + ' fish remain'}</h1>

      <div class="legend">
        <span><i style="background:${collapsed?'#f87171':'#06b6d4'}"></i>Fish stock over ${FISH_SEASONS} seasons</span>
      </div>
      ${fishChart(stock, collapsed)}

      <div class="result-box">
        <div class="row"><span class="k">Harvest rate</span><span class="v">${rate}%</span></div>
        <div class="row"><span class="k">Breeding rate</span><span class="v">10%</span></div>
        <div class="row"><span class="k">Total fish caught</span><span class="v good">${totalCatch}</span></div>
        <div class="row"><span class="k">Final stock</span><span class="v ${finalStock < 60 ? 'bad' : 'good'}">${finalStock}</span></div>
      </div>

      <div class="verdict ${verdictClass}">
        <strong>${verdictTitle}</strong>
        ${verdictText}
      </div>

      <div class="insight">
        <b>Key idea</b>
        A stock grows by inflows and shrinks by outflows. Harvest is a balancing loop: it reduces the very thing that produces next season's fish. Because births lag, the feedback is <b>delayed</b>. By the time you see the problem, it's already locked in.
      </div>

      <div class="center big-star" aria-label="${stars} of 3 stars">${starRow(stars)}</div>

      <button class="btn" onclick="go('policy')">Next: Policy Lab →</button>
      <div class="btn-row">
        <button class="btn ghost" onclick="go('fish')">Try again</button>
        <button class="btn ghost" onclick="go('home')">Home</button>
      </div>
    </div>
  `);
}

  },
  {
    q: 'You already paid $50 for a ticket. The concert is boring. What should guide your decision to stay?',
    options: ['The $50 you spent', 'How much fun you\'ll have from now on', 'How long you waited in line'],
    correct: 1
  }
];
const CHAL_SECONDS = 8;

let chalIdx = 0, chalCorrect = 0, chalPicked = null, chalTimer = null;

function renderChallenge() {
  if (payload.stage === 'result') return renderChallengeResult();
  // Fresh run: reset state and show the first question in this same render.
  if (payload.stage !== 'question') {
    chalIdx = 0; chalCorrect = 0;
    payload = { stage:'question', results: [] };
  }
  return renderChallengeQuestion();
}

function renderChallengeQuestion() {
  const q = CHALLENGE_QS[chalIdx];
  chalPicked = null;

  const dots = CHALLENGE_QS.map((_,i) => {
    let c = '';
    if (i < chalIdx) c = payload.results[i] ? 'ok' : 'no';
    else if (i === chalIdx) c = 'on';
    return `<i class="${c}"></i>`;
  }).join('');

  const opts = q.options.map((o,i) =>
    `<button class="option-btn" id="c-${i}" onclick="pickChallenge(${i})">${esc(o)}</button>`
  ).join('');

  const node = h(`
    <div>
      <button class="back" onclick="go('home')">← Quit</button>
      <div class="dots">${dots}</div>
      <div class="timerbar run" id="tbar"><i></i></div>
      <p class="muted" style="margin:0 0 6px">Question ${chalIdx + 1} of ${CHALLENGE_QS.length}</p>
      <h1 class="title" style="font-size:22px">${esc(q.q)}</h1>
      <div style="margin-top:16px">${opts}</div>
    </div>
  `);

  clearTimeout(chalTimer);
  chalTimer = setTimeout(() => {
    if (chalPicked === null && screen === 'challenge' && payload.stage === 'question') {
      chalPicked = -1;
      answerChallenge(-1);
    }
  }, CHAL_SECONDS * 1000);

  return node;
}

function pickChallenge(i) {
  if (chalPicked !== null) return;
  chalPicked = i;
  clearTimeout(chalTimer);
  const el = document.getElementById('c-' + i);
  if (el) el.classList.add('picked');
  const bar = document.getElementById('tbar');
  if (bar) bar.querySelector('i').style.animationPlayState = 'paused';
  chalTimer = setTimeout(() => answerChallenge(i), 320);
}

function answerChallenge(i) {
  clearTimeout(chalTimer);
  const q = CHALLENGE_QS[chalIdx];
  const correct = i === q.correct;
  if (correct) chalCorrect++;
  payload.results[chalIdx] = correct;

  // brief feedback flash
  const el = document.getElementById('c-' + q.correct);
  if (el) el.classList.add('correct');
  if (i > -1 && i !== q.correct) {
    const wrong = document.getElementById('c-' + i);
    if (wrong) { wrong.classList.remove('picked'); wrong.classList.add('wrong'); }
  }

  chalIdx++;
  chalTimer = setTimeout(() => {
    if (screen !== 'challenge') return;
    if (chalIdx >= CHALLENGE_QS.length) {
      let stars = 1;
      if (chalCorrect >= 4) stars = 2;
      if (chalCorrect >= 6) stars = 3;
      setStars('challenge', stars);
      go('challenge', { stage:'result', score: chalCorrect, total: CHALLENGE_QS.length, results: payload.results, stars });
    } else {
      render();
    }
  }, i === -1 ? 900 : 620);
}

function renderChallengeResult() {
  const { score, total, results, stars } = payload;
  const pct = Math.round((score / total) * 100);
  let title, cls;
  if (score === total) { title = 'Flawless ⚡'; cls = 'win'; }
  else if (pct >= 66) { title = 'Strong run'; cls = 'win'; }
  else if (pct >= 50) { title = 'Getting there'; cls = 'mid'; }
  else { title = 'Keep training'; cls = 'mid'; }

  const review = CHALLENGE_QS.map((q,i) => `
    <div class="row">
      <span class="k">${esc(q.q)}<br><span class="good" style="font-size:12px">${esc(q.options[q.correct])}</span></span>
      <span class="v ${results[i]?'good':'bad'}">${results[i]?'✓':'✗'}</span>
    </div>`).join('');

  return h(`
    <div>
      <button class="back" onclick="go('home')">← Home</button>
      <span class="pill" style="background:#2a1f05; color:#fbbf24">Challenge Mode</span>
      <h1 class="title">${title}</h1>

      <div class="result-box">
        <div class="row"><span class="k">Correct answers</span><span class="v">${score} / ${total}</span></div>
        <div class="row"><span class="k">Accuracy</span><span class="v">${pct}%</span></div>
        <div class="row"><span class="k">Concepts covered</span><span class="v">All 4</span></div>
      </div>

      <div class="verdict ${cls}">
        <strong>${score === total ? 'You nailed every one.' : 'Review the ones you missed.'}</strong>
        Challenge mode mixes all four concepts with no hints and a time limit, which is closer to how these decisions show up in real life.
      </div>

      <p class="section-label">Answers</p>
      <div class="result-box">${review}</div>

      <div class="center big-star" aria-label="${stars} of 3 stars">${starRow(stars)}</div>

      <button class="btn" onclick="go('challenge')">Run it again</button>
      <div class="btn-row">
        <button class="btn ghost" onclick="go('home')">Home</button>
      </div>
    </div>
  `);
}

/* =========================================================
   BOOT
   ========================================================= */
render();
</script>
</body>
</html>
